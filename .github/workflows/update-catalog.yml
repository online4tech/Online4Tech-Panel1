name: Update catalog

# Rebuilds catalog.json (panel-v2 branch) from the Online4Tech JSON databases + custom.json.
#  - every day at 03:00 UTC (scheduled runs only start from the default branch, so a copy of this
#    file also lives on `main`; both copies always check out and commit to `panel-v2`)
#  - whenever custom.json is edited on panel-v2
#  - manually from the Actions tab (Run workflow)
# When the catalog changed it also rebuilds the IPK (it embeds an offline copy) and commits both.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [panel-v2]
    paths: [custom.json]

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: panel-v2
      - name: Rebuild catalog
        run: python3 tools/build_catalog.py
      - name: Rebuild IPK and commit if changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog unchanged"
            exit 0
          fi
          ./build_ipk.sh
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalog.json plugin release
          git commit -m "Update catalog (automatic)"
          git push origin HEAD:panel-v2
