<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060b14"><title>Online4Tech Panel</title>
<style>
:root{--ink:#060b14;--deep:#0a1322;--panel:#0e1a2e;--edge:#1b2c47;--txt:#d6e2f3;--mut:#7f93b2;--sig:#29e0ff;--sig2:#5b8cff;--hot:#ff5d73;--sun:#ffb454;--ok:#3ee6a0;
--glow:0 0 0 1px rgba(41,224,255,.35) inset,0 0 18px rgba(41,224,255,.22);--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);background:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.55;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1100px 520px at 90% -12%,rgba(41,224,255,.10),transparent 60%),radial-gradient(900px 600px at -10% 105%,rgba(91,140,255,.10),transparent 60%)}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:20px 16px;border-inline-end:1px solid var(--edge);background:linear-gradient(180deg,rgba(14,26,46,.9),rgba(8,15,28,.95));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#0f3a52,#0a2236);border:1px solid rgba(41,224,255,.5);box-shadow:0 0 22px rgba(41,224,255,.28);display:grid;place-items:center}
.mark svg{width:26px;height:26px}
.brand b{font-size:17px;letter-spacing:.2px;display:block}.brand small{color:var(--mut);font-size:12px}
.menu{display:grid;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;border:1px solid transparent;color:var(--mut);padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;transition:.18s}
.menu button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu button:hover{color:var(--txt);background:rgba(41,224,255,.06)}
.menu button.on{color:#eafcff;background:linear-gradient(90deg,rgba(41,224,255,.16),rgba(41,224,255,.03));border-color:rgba(41,224,255,.4);box-shadow:0 0 18px rgba(41,224,255,.15)}
.side-foot{margin-top:auto;display:grid;gap:10px}
.lang{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--edge);border-radius:999px;padding:3px;background:var(--deep)}
.lang button{border:0;background:transparent;color:var(--mut);font:inherit;padding:7px;border-radius:999px;cursor:pointer;transition:.18s}
.lang button.on{color:#02202a;background:linear-gradient(135deg,var(--sig),#7fb2ff);box-shadow:0 0 16px rgba(41,224,255,.5);font-weight:700}
main{padding:22px clamp(16px,2.2vw,36px) 90px;width:100%;min-width:0}
.page{display:none}.page.on{display:block}
h1{font-size:24px;margin:0 0 2px;font-weight:700}.sub{color:var(--mut);margin:0 0 16px}
.panel{background:linear-gradient(180deg,rgba(18,32,55,.78),rgba(11,20,36,.82));border:1px solid var(--edge);border-radius:18px;padding:18px}
.panel+.panel{margin-top:18px}
h2{font-size:16px;margin:0 0 14px;font-weight:600}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.box{width:clamp(150px,16vw,230px);filter:drop-shadow(0 8px 22px rgba(41,224,255,.18))}.box svg{width:100%;display:block}
.home{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}.home .panel+.panel{margin-top:0}.home .col{display:grid;gap:18px}
@media(max-width:1100px){.home{grid-template-columns:1fr}}
.model{font-size:22px;font-weight:700;direction:ltr;text-align:start;word-break:break-word}.image{color:var(--mut);direction:ltr;text-align:start;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--ok);font-size:13px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.g{padding:10px 6px}
.g{display:grid;justify-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:rgba(6,11,20,.55);border:1px solid var(--edge)}
.ring{position:relative;width:clamp(84px,7.5vw,108px);aspect-ratio:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.ring .bg{stroke:#14243d}
.ring .fg{stroke:var(--sig);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1),stroke .3s;filter:drop-shadow(0 0 6px currentColor)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;direction:ltr}
.g span{font-weight:600}.g small{color:var(--mut);direction:ltr}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.mini div{padding:12px 14px;border-radius:14px;background:rgba(6,11,20,.55);border:1px solid var(--edge)}
.mini small{color:var(--mut);display:block}.mini b{display:inline-block;font-size:17px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}.btns .btn{min-height:42px;padding:8px 10px;font-size:14px}
.btn,button.btn{font:inherit;color:#dff9ff;cursor:pointer;border-radius:12px;padding:12px 16px;border:1px solid rgba(41,224,255,.4);background:linear-gradient(180deg,#0f2a40,#0a1d2f);box-shadow:var(--glow);transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{transform:translateY(-1px);border-color:var(--sig);box-shadow:0 0 0 1px rgba(41,224,255,.7) inset,0 0 30px rgba(41,224,255,.45)}
.btn:active{transform:translateY(0)}
.btn.pri{color:#021a22;font-weight:700;border:0;background:linear-gradient(135deg,var(--sig),#79a8ff);box-shadow:0 0 24px rgba(41,224,255,.45)}
.btn.pri:hover{box-shadow:0 0 38px rgba(41,224,255,.8)}
.btn.sun{color:#ffe7bf;border-color:rgba(255,180,84,.5);background:linear-gradient(180deg,#33240f,#241a0b);box-shadow:0 0 0 1px rgba(255,180,84,.3) inset,0 0 18px rgba(255,180,84,.2)}
.btn.sun:hover{border-color:var(--sun);box-shadow:0 0 0 1px rgba(255,180,84,.7) inset,0 0 30px rgba(255,180,84,.45)}
.btn.hot{color:#ffd9de;border-color:rgba(255,93,115,.55);background:linear-gradient(180deg,#34121a,#240c12);box-shadow:0 0 0 1px rgba(255,93,115,.3) inset,0 0 18px rgba(255,93,115,.22)}
.btn.hot:hover{border-color:var(--hot);box-shadow:0 0 0 1px rgba(255,93,115,.7) inset,0 0 30px rgba(255,93,115,.5)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:wait}
input,select{font:inherit;color:var(--txt);background:var(--deep);border:1px solid var(--edge);border-radius:12px;padding:11px 14px;min-height:44px;width:100%;transition:.18s}
input:focus,select:focus{outline:none;border-color:var(--sig);box-shadow:0 0 0 3px rgba(41,224,255,.18)}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>.grow{flex:1;min-width:180px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid var(--edge);background:var(--deep);color:var(--mut);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13.5px;transition:.18s}
.chip:hover{color:var(--txt);border-color:#2b4570}
.chip.on{color:#eafcff;border-color:var(--sig);background:rgba(41,224,255,.12);box-shadow:0 0 16px rgba(41,224,255,.3)}
.chip em{font-style:normal;opacity:.65;margin-inline-start:6px}
.count{color:var(--mut);font-size:13px;margin:10px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:16px;border-radius:16px;background:rgba(6,11,20,.55);border:1px solid var(--edge);transition:.2s}
.card:hover{border-color:rgba(41,224,255,.45);box-shadow:0 0 24px rgba(41,224,255,.12)}
.card .n{font-weight:650;word-break:break-word}.card .m{color:var(--mut);font-size:12.5px;margin-top:5px;max-width:60ch}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:7px;margin-inline-start:8px;vertical-align:middle}
.tag.ok{color:var(--ok);background:rgba(62,230,160,.12)}.tag.w{color:var(--sun);background:rgba(255,180,84,.12)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{color:var(--mut);font-size:13px}
pre{margin:0;background:#04080f;border:1px solid var(--edge);border-radius:12px;padding:14px;min-height:140px;max-height:48vh;overflow:auto;direction:ltr;text-align:left;white-space:pre-wrap;font-size:12.5px;color:#a9f5d2;font-family:ui-monospace,Consolas,monospace}
#drawer{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(6,11,20,.97);border-top:1px solid var(--sig);box-shadow:0 -12px 40px rgba(41,224,255,.15);padding:14px clamp(16px,3vw,40px);display:none}
#drawer .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0d1a2e;border:1px solid var(--sig);box-shadow:0 0 24px rgba(41,224,255,.3);padding:11px 20px;border-radius:12px;display:none;z-index:30;max-width:90vw}
.links{display:flex;gap:6px;flex-wrap:nowrap}.links .soc{min-width:38px;min-height:38px;padding:0 6px}
.soc{--c:var(--sig);display:inline-flex;align-items:center;gap:10px;color:#eafcff;text-decoration:none;border-radius:13px;border:1px solid var(--c);background:rgba(6,11,20,.6);min-height:42px;min-width:42px;justify-content:center;padding:0 10px;transition:.2s;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent) inset,0 0 16px color-mix(in srgb,var(--c) 30%,transparent)}
.soc svg{width:22px;height:22px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.soc:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--c) inset,0 0 30px color-mix(in srgb,var(--c) 65%,transparent)}
.soc.whatsapp{--c:#25d366}.soc.messenger{--c:#4c8dff}.soc.page{--c:#6aa5ff}.soc.store{--c:var(--sun)}.soc.site{--c:var(--sig)}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}.contact .soc{justify-content:flex-start;padding:0 12px;min-height:44px;font-size:14px}
@media(max-width:860px){
.shell{display:block}
aside{position:fixed;z-index:15;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:8px;border-inline-end:0;border-top:1px solid var(--edge);gap:6px;background:rgba(8,15,28,.97)}
.brand,.side-foot .links{display:none}.menu{display:flex;flex:1;overflow-x:auto;gap:4px}
.menu button{flex-direction:column;gap:3px;padding:8px 10px;font-size:11.5px;min-width:64px;justify-content:center;text-align:center}
.side-foot{margin:0;align-self:center}.side-foot .note{display:none}.lang{width:96px}.lang button{padding:6px 4px;font-size:12px}.menu button{min-width:58px}
main{padding:18px 14px 110px}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.gauges{gap:10px}.ring{width:84px;height:84px}.ring b{font-size:16px}
#drawer{bottom:68px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- optional skin: Gold (premium, warm champagne on graphite). Default look is untouched. ---- */
html[data-skin=gold]{--ink:#0d0c0a;--deep:#14120f;--panel:#1a1713;--edge:#3a3226;--txt:#efe6d4;--mut:#a39880;--sig:#d9b36a;--sig2:#f0d38f;--hot:#e0745f;--sun:#d9b36a;--ok:#8fcf9a;
--glow:0 0 0 1px rgba(217,179,106,.4) inset,0 0 16px rgba(217,179,106,.16);--r:6px}
html[data-skin=gold] body{font-family:Georgia,"Noto Naskh Arabic","Segoe UI",Tahoma,serif}
html[data-skin=gold] body:before{background:radial-gradient(900px 480px at 100% -10%,rgba(217,179,106,.10),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(217,179,106,.05),transparent 60%)}
html[data-skin=gold] aside{background:linear-gradient(180deg,#17140f,#0e0c09);border-inline-end:1px solid var(--edge)}
html[data-skin=gold] .mark{background:#1d1810;border-color:rgba(217,179,106,.6);box-shadow:0 0 18px rgba(217,179,106,.2);border-radius:6px}
html[data-skin=gold] .mark svg{stroke:#d9b36a}
html[data-skin=gold] .menu button{border-radius:4px;letter-spacing:.3px}
html[data-skin=gold] .menu button:hover{background:rgba(217,179,106,.07)}
html[data-skin=gold] .menu button.on{color:#f6e7c1;background:linear-gradient(90deg,rgba(217,179,106,.18),rgba(217,179,106,.02));border-color:rgba(217,179,106,.5);box-shadow:none;border-inline-start:3px solid #d9b36a}
html[data-skin=gold] .lang,html[data-skin=gold] .skinbtn{border-radius:4px}
html[data-skin=gold] .lang button{border-radius:3px}
html[data-skin=gold] .lang button.on{color:#1a1409;background:linear-gradient(135deg,#d9b36a,#f0d38f);box-shadow:none}
html[data-skin=gold] .panel{background:linear-gradient(180deg,#1d1914,#15120e);border-radius:6px;border:1px solid var(--edge);box-shadow:0 1px 0 rgba(240,211,143,.08) inset}
html[data-skin=gold] h1{font-weight:400;letter-spacing:.6px;font-size:28px;border-bottom:1px solid var(--edge);padding-bottom:10px;margin-bottom:10px}
html[data-skin=gold] .soc{border-radius:4px;background:rgba(13,12,10,.7);box-shadow:none}
html[data-skin=gold] button,html[data-skin=gold] input{border-radius:4px}
html[data-skin=gold] .btn,html[data-skin=gold] button.btn{color:#efe6d4;border-radius:4px;border:1px solid rgba(217,179,106,.4);background:linear-gradient(180deg,#221d15,#17130e);box-shadow:none}
html[data-skin=gold] .btn:hover{border-color:#d9b36a;box-shadow:0 0 18px rgba(217,179,106,.28)}
html[data-skin=gold] .btn.pri{color:#1a1409;border:0;background:linear-gradient(135deg,#d9b36a,#f0d38f);box-shadow:none}
html[data-skin=gold] .btn.sun{color:#f0d38f;border-color:rgba(217,179,106,.6);background:linear-gradient(180deg,#2b2212,#1c160b);box-shadow:none}
html[data-skin=gold] .btn.hot{color:#f3c0b5;border-color:rgba(224,116,95,.55);background:linear-gradient(180deg,#2c1511,#1d0e0b);box-shadow:none}
.skinbtn{width:100%;border:1px solid var(--edge);background:var(--deep);color:var(--mut);font:inherit;padding:8px;border-radius:999px;cursor:pointer;transition:.18s}
.skinbtn:hover{color:var(--txt);border-color:var(--sig)}

/* ---- terminal command library (all skins) ---- */
.libbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.libbar input{flex:1;min-width:200px}
.warn{margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,180,84,.5);background:rgba(255,180,84,.1);color:var(--sun);font-size:13.5px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.cmd{display:flex;flex-direction:column;gap:9px;padding:15px;border-radius:16px;background:rgba(6,11,20,.55);border:1px solid var(--edge);transition:.2s}
.cmd:hover{border-color:rgba(41,224,255,.4)}
.cmd .t{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmd .d{color:var(--mut);font-size:13px}
.cmd code{display:block;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#04080f;color:#a9f5d2;border-radius:10px;padding:9px 11px;white-space:pre-wrap;word-break:break-all;max-height:84px;overflow:auto}
.cmd .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.tag.c{color:var(--sun);background:rgba(255,180,84,.14)}

/* ---- skin: Prime (light, top navigation, editorial cards; bottom dock on phones) ---- */
html[data-skin=prime]{--ink:#eef1f7;--deep:#ffffff;--panel:#ffffff;--edge:#dde3ee;--txt:#0f1b2d;--mut:#5a6a83;--sig:#4338ca;--sig2:#6366f1;--hot:#e11d48;--sun:#b45309;--ok:#047857;color-scheme:light}
html[data-skin=prime] body{font-family:"Segoe UI",Inter,Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--ink)}
html[data-skin=prime] body:before{background:radial-gradient(820px 420px at 88% -8%,rgba(99,102,241,.18),transparent 60%),radial-gradient(700px 420px at 0% 0%,rgba(14,165,164,.12),transparent 60%)}
html[data-skin=prime] .shell{display:block}
html[data-skin=prime] aside{position:sticky;top:0;z-index:15;height:auto;overflow:visible;display:flex;flex-direction:row;align-items:center;gap:18px;padding:12px clamp(16px,3vw,40px);background:rgba(255,255,255,.94);border:0;border-bottom:1px solid var(--edge);box-shadow:0 8px 28px rgba(15,27,45,.06)}
html[data-skin=prime] .brand b{color:#0f1b2d;font-weight:800}
html[data-skin=prime] .mark{background:#eef0ff;border:1px solid #c9cdfd;box-shadow:none;border-radius:14px}
html[data-skin=prime] .mark svg{stroke:#4338ca}
html[data-skin=prime] .menu{display:flex;flex:1;justify-content:center;gap:2px;width:max-content;max-width:100%;margin:0 auto;padding:5px;background:#e9edf5;border-radius:999px;overflow-x:auto;scrollbar-width:none}
html[data-skin=prime] .menu button{width:auto;flex:none;flex-direction:row;gap:8px;padding:9px 16px;border-radius:999px;color:#4b5b75;font-weight:600;font-size:14px;border:0;white-space:nowrap}
html[data-skin=prime] .menu button:hover{background:rgba(255,255,255,.7);color:#0f1b2d}
html[data-skin=prime] .menu button.on{color:#3730a3;background:#fff;box-shadow:0 3px 12px rgba(15,27,45,.14)}
html[data-skin=prime] .side-foot{margin:0;display:flex;align-items:center;gap:10px}
html[data-skin=prime] .side-foot .links,html[data-skin=prime] .side-foot .note{display:none}
html[data-skin=prime] .lang{width:132px;background:#e9edf5;border:0}
html[data-skin=prime] .lang button{font-weight:600;color:#4b5b75}
html[data-skin=prime] .lang button.on{color:#3730a3;background:#fff;box-shadow:0 2px 8px rgba(15,27,45,.16)}
html[data-skin=prime] .skinbtn{width:auto;white-space:nowrap;padding:8px 16px;color:#3730a3;background:#fff;border:1px solid #c9cdfd;font-weight:600}
html[data-skin=prime] .skinbtn:hover{background:#eef0ff;border-color:#4338ca}
html[data-skin=prime] main{max-width:1240px;margin:0 auto;padding:34px clamp(16px,3vw,40px) 96px}
html[data-skin=prime] h1{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-.6px;margin:0 0 4px;color:#0f1b2d}
html[data-skin=prime] .sub{font-size:16px;margin:0 0 26px}
html[data-skin=prime] h2{font-size:17px;font-weight:700;color:#0f1b2d}
html[data-skin=prime] .panel{background:#fff;border:1px solid var(--edge);border-radius:26px;padding:24px;box-shadow:0 16px 44px rgba(15,27,45,.07)}
html[data-skin=prime] .home .col:first-child .panel{color:#fff;border:0;background:radial-gradient(520px 260px at 100% 0%,rgba(129,140,248,.45),transparent 65%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca);box-shadow:0 22px 56px rgba(49,46,129,.38)}
html[data-skin=prime] .home .col:first-child .model{color:#fff;font-size:26px;font-weight:800}
html[data-skin=prime] .home .col:first-child .image,html[data-skin=prime] .home .col:first-child .mini small{color:rgba(255,255,255,.72)}
html[data-skin=prime] .home .col:first-child .live{color:#86efac}
html[data-skin=prime] .home .col:first-child .g,html[data-skin=prime] .home .col:first-child .mini div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16)}
html[data-skin=prime] .home .col:first-child .ring .bg{stroke:rgba(255,255,255,.2)}
html[data-skin=prime] .home .col:first-child .g small,html[data-skin=prime] .home .col:first-child .g span{color:#fff}
html[data-skin=prime] .home .col:first-child .ring b,html[data-skin=prime] .home .col:first-child .mini b{color:#fff}

var libCat="install",MINE=[];

function fillCmd(c){var out=c,m,re=/\{\{(\w+)\}\}/;
 if(out.indexOf("__INSTALL_URL__")>=0){if(!last||!last.install_url){toast("...");return null}out=out.replace(/__INSTALL_URL__/g,last.install_url)}
 while((m=re.exec(out))){var v=prompt(t("ask")+" ("+m[1]+")","");if(v===null)return null;v=v.trim();
  var ok=m[1]=="url"?/^https?:\/\/[^\s'"`$;|&<>]+$/.test(v):/^[A-Za-z0-9._+-]{1,80}$/.test(v);
  if(!ok){toast(t("bad_val"));return null}out=out.replace(re,v)}
 return out}

 var f=fillCmd(c);if(!f)return;$("cmd").value=f;if(risky&&!confirm(t("confirm_cmd")+"\n\n"+f))return;start("/api/shell",{cmd:f},f.slice(0,40))}

 return out}
