<style>
:root{--ink:#060b14;--deep:#0a1322;--panel:#0e1a2e;--edge:#1b2c47;--txt:#d6e2f3;--mut:#7f93b2;--sig:#29e0ff;--sig2:#5b8cff;--hot:#ff5d73;--sun:#ffb454;--ok:#3ee6a0;
--glow:0 0 0 1px rgba(41,224,255,.35) inset,0 0 18px rgba(41,224,255,.22);--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);background:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.55;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1100px 520px at 90% -12%,rgba(41,224,255,.10),transparent 60%),radial-gradient(900px 600px at -10% 105%,rgba(91,140,255,.10),transparent 60%)}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-end:1px solid var(--edge);background:linear-gradient(180deg,rgba(14,26,46,.9),rgba(8,15,28,.95));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#0f3a52,#0a2236);border:1px solid rgba(41,224,255,.5);box-shadow:0 0 22px rgba(41,224,255,.28);display:grid;place-items:center}
.mark svg{width:26px;height:26px}
.brand b{font-size:17px;letter-spacing:.2px;display:block}.brand small{color:var(--mut);font-size:12px}
.menu{display:grid;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;border:1px solid transparent;color:var(--mut);padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;transition:.18s}
.menu button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu button:hover{color:var(--txt);background:rgba(41,224,255,.06)}
.menu button.on{color:#eafcff;background:linear-gradient(90deg,rgba(41,224,255,.16),rgba(41,224,255,.03));border-color:rgba(41,224,255,.4);box-shadow:0 0 18px rgba(41,224,255,.15)}
.side-foot{margin-top:auto;display:grid;gap:10px}
.lang{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--edge);border-radius:999px;padding:3px;background:var(--deep)}
.lang button{border:0;background:transparent;color:var(--mut);font:inherit;padding:7px;border-radius:999px;cursor:pointer;transition:.18s}
.lang button.on{color:#02202a;background:linear-gradient(135deg,var(--sig),#7fb2ff);box-shadow:0 0 16px rgba(41,224,255,.5);font-weight:700}
main{padding:28px clamp(16px,3vw,40px) 90px;max-width:1180px;width:100%}
.page{display:none}.page.on{display:block}
h1{font-size:26px;margin:0 0 4px;font-weight:700}.sub{color:var(--mut);margin:0 0 22px}
.panel{background:linear-gradient(180deg,rgba(18,32,55,.78),rgba(11,20,36,.82));border:1px solid var(--edge);border-radius:18px;padding:20px}
.panel+.panel{margin-top:18px}
h2{font-size:16px;margin:0 0 14px;font-weight:600}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.model{font-size:22px;font-weight:700;direction:ltr;text-align:start;word-break:break-word}.image{color:var(--mut);direction:ltr;text-align:start;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--ok);font-size:13px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.g{display:grid;justify-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:rgba(6,11,20,.55);border:1px solid var(--edge)}
.ring{position:relative;width:104px;height:104px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.ring .bg{stroke:#14243d}
.ring .fg{stroke:var(--sig);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1),stroke .3s;filter:drop-shadow(0 0 6px currentColor)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;direction:ltr}
.g span{font-weight:600}.g small{color:var(--mut);direction:ltr}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.mini div{padding:12px 14px;border-radius:14px;background:rgba(6,11,20,.55);border:1px solid var(--edge)}
.mini small{color:var(--mut);display:block}.mini b{display:inline-block;font-size:17px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.btn,button.btn{font:inherit;color:#dff9ff;cursor:pointer;border-radius:12px;padding:12px 16px;border:1px solid rgba(41,224,255,.4);background:linear-gradient(180deg,#0f2a40,#0a1d2f);box-shadow:var(--glow);transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{transform:translateY(-1px);border-color:var(--sig);box-shadow:0 0 0 1px rgba(41,224,255,.7) inset,0 0 30px rgba(41,224,255,.45)}
.btn:active{transform:translateY(0)}
.btn.pri{color:#021a22;font-weight:700;border:0;background:linear-gradient(135deg,var(--sig),#79a8ff);box-shadow:0 0 24px rgba(41,224,255,.45)}
.btn.pri:hover{box-shadow:0 0 38px rgba(41,224,255,.8)}
.btn.sun{color:#ffe7bf;border-color:rgba(255,180,84,.5);background:linear-gradient(180deg,#33240f,#241a0b);box-shadow:0 0 0 1px rgba(255,180,84,.3) inset,0 0 18px rgba(255,180,84,.2)}
.btn.sun:hover{border-color:var(--sun);box-shadow:0 0 0 1px rgba(255,180,84,.7) inset,0 0 30px rgba(255,180,84,.45)}
.btn.hot{color:#ffd9de;border-color:rgba(255,93,115,.55);background:linear-gradient(180deg,#34121a,#240c12);box-shadow:0 0 0 1px rgba(255,93,115,.3) inset,0 0 18px rgba(255,93,115,.22)}
.btn.hot:hover{border-color:var(--hot);box-shadow:0 0 0 1px rgba(255,93,115,.7) inset,0 0 30px rgba(255,93,115,.5)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:wait}
input,select{font:inherit;color:var(--txt);background:var(--deep);border:1px solid var(--edge);border-radius:12px;padding:11px 14px;min-height:44px;width:100%;transition:.18s}
input:focus,select:focus{outline:none;border-color:var(--sig);box-shadow:0 0 0 3px rgba(41,224,255,.18)}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>.grow{flex:1;min-width:180px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid var(--edge);background:var(--deep);color:var(--mut);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13.5px;transition:.18s}
.chip:hover{color:var(--txt);border-color:#2b4570}
.chip.on{color:#eafcff;border-color:var(--sig);background:rgba(41,224,255,.12);box-shadow:0 0 16px rgba(41,224,255,.3)}
.chip em{font-style:normal;opacity:.65;margin-inline-start:6px}
.count{color:var(--mut);font-size:13px;margin:10px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:16px;border-radius:16px;background:rgba(6,11,20,.55);border:1px solid var(--edge);transition:.2s}
.card:hover{border-color:rgba(41,224,255,.45);box-shadow:0 0 24px rgba(41,224,255,.12)}
.card .n{font-weight:650;word-break:break-word}.card .m{color:var(--mut);font-size:12.5px;margin-top:5px;max-width:60ch}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:7px;margin-inline-start:8px;vertical-align:middle}
.tag.ok{color:var(--ok);background:rgba(62,230,160,.12)}.tag.w{color:var(--sun);background:rgba(255,180,84,.12)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{color:var(--mut);font-size:13px}

#drawer{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(6,11,20,.97);border-top:1px solid var(--sig);box-shadow:0 -12px 40px rgba(41,224,255,.15);padding:14px clamp(16px,3vw,40px);display:none}

.links{display:flex;gap:10px;flex-wrap:wrap}

.brand,.side-foot .links{display:none}.menu{display:flex;flex:1;overflow-x:auto;gap:4px}

 var M=$("mini");M.textContent="";M.appendChild(mini(t("uptime"),fmt(s.uptime)));M.appendChild(mini("Panel","v"+s.version));
 $("ver").textContent="v"+s.version;var L=$("links");L.textContent="";[["support","support"],["site","site"],["store","store"]].forEach(function(k){if(s.links[k[0]]){var a=el("a","btn sm",t(k[1]));a.href=s.links[k[0]];a.target="_blank";a.rel="noopener";L.appendChild(a)}});busy=s.busy}
function status(){api("/api/status").then(renderStatus).catch(function(e){toast(e.message)})}
function drawer(on){$("drawer").style.display=on?"block":"none"}$("dx").onclick=function(){drawer(false)};
function follow(id,title){var from=0,out=$("out");out.textContent="";$("dt").textContent=title||t("output");drawer(true);busy=true;
 (function tick(){api("/api/job?id="+id+"&from="+from).then(function(j){if(j.out){out.textContent+=j.out;out.scrollTop=out.scrollHeight}from=j.next;if(!j.done)setTimeout(tick,1000);else{busy=false;if(NAV.indexOf(cur)>0&&cur!="iptv"&&cur!="term")load()}}).catch(function(e){toast(e.message);busy=false})})()}
function start(path,body,title){if(busy)return toast(t("busy"));api(path,body).then(function(r){if(r.job)follow(r.job,title);else toast(t("done"))}).catch(function(e){toast(e.message)})}
function setCatTitle(){if(["plugin","skin","channels","picons"].indexOf(cur)<0)return;$("cat-title").textContent=t(cur);$("cat-sub").textContent=t(cur+"_sub")}
function go(k){cur=k;NAV.forEach(function(n){var p=$(n=="home"?"p-home":n=="iptv"?"p-iptv":n=="term"?"p-term":"p-cat");p.className="page"});
 var p=k=="home"?"p-home":k=="iptv"?"p-iptv":k=="term"?"p-term":"p-cat";$(p).className="page on";buildMenu();window.scrollTo(0,0);
 if(p=="p-cat"){kind=k;cat="";$("q").value="";setCatTitle();load()}}
function chip(name,n,val){var c=el("button","chip"+(cat==val?" on":""),name);if(n!=null)c.appendChild(el("em","",n));c.onclick=function(){cat=val;load()};return c}
function load(){var u="/api/catalog?kind="+kind+"&cat="+encodeURIComponent(cat)+"&q="+encodeURIComponent($("q").value)+"&all="+($("all").checked?1:0);
 api(u).then(function(d){var C=$("chips");C.textContent="";var tot=0;d.cats.forEach(function(c){tot+=c.count});C.appendChild(chip(t("all"),tot,""));d.cats.forEach(function(c){C.appendChild(chip(c.name,c.count,c.name))});
  $("count").textContent=d.total+" "+t("items")+(d.total>d.items.length?" ("+t("first")+" "+d.items.length+")":"");var L=$("list");L.textContent="";
  if(!d.items.length)L.appendChild(el("div","empty",t("none")));
  d.items.forEach(function(it){var c=el("div","card"),i=el("div"),n=el("div","n",it.name);if(it.installed)n.appendChild(el("span","tag ok",t("installed")));if(!it.compat)n.appendChild(el("span","tag w",t("incompat")));
   i.appendChild(n);i.appendChild(el("div","m",it.cat+(it.desc?" - "+it.desc:"")));c.appendChild(i);var g=el("div","row");
   var b=el("button","btn sm"+(it.installed?"":" pri"),it.installed?t("reinstall"):t("install"));b.onclick=function(){start("/api/install",{id:it.id},it.name)};g.appendChild(b);
   if(it.removable&&it.installed){var x=el("button","btn sm hot",t("remove"));x.onclick=function(){if(confirm(t("confirm_rm")+" "+it.name+"?"))start("/api/remove",{id:it.id},it.name)};g.appendChild(x)}
   c.appendChild(g);L.appendChild(c)})}).catch(function(e){toast(e.message)})}
var tm;$("q").oninput=function(){clearTimeout(tm);tm=setTimeout(load,300)};$("all").onchange=load;
$("iptv-save").onclick=function(){api("/api/iptv",{player:$("pl").value,m3u:$("m3u").value,host:$("host").value,port:$("port").value,user:$("user").value,pass:$("pass").value}).then(function(r){toast(r.message);$("pass").value=""}).catch(function(e){toast(e.message)})};
$("run").onclick=function(){var c=$("cmd").value.trim();if(c)start("/api/shell",{cmd:c},c.slice(0,40))};
$("cmd").onkeydown=function(e){if(e.key=="Enter")$("run").click()};
$("l-ar").onclick=function(){lang="ar";applyLang()};$("l-en").onclick=function(){lang="en";applyLang()};
applyLang();go("home");status();setInterval(status,15000);
</script></body></html>
